name: Organize card assets

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/export-card-assets.yml
      - assets/cards-webp/**

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out card organization branch
        uses: actions/checkout@v4
        with:
          ref: chore/organize-card-assets
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Organize and rename card assets
        run: pnpm assets:organize

      - name: Validate project
        run: pnpm check

      - name: Remove temporary workflow and commit results
        run: |
          rm -f .github/workflows/export-card-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: classify and rename card assets"
          git push origin HEAD:chore/organize-card-assets
