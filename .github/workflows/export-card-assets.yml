name: Export repository snapshot

on:
  pull_request:
    branches:
      - master
      - feature/library-and-deckbuilding-table
      - chore/organize-card-assets
    paths:
      - .github/workflows/export-card-assets.yml
      - assets/cards-webp/**

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Archive repository snapshot
        run: zip -r repository-snapshot.zip . -x '.git/*' 'node_modules/*'

      - name: Upload repository snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository-snapshot
          path: repository-snapshot.zip
          retention-days: 1
