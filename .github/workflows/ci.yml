name: Project checks

on:
  pull_request:
  push:
    branches:
      - master
      - feature/library-and-deckbuilding-table
      - feature/reserve-panel-functional-rebuild

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          path: sanguosha-manual-vtt

      - name: Check out VirtualTabletop validator
        uses: actions/checkout@v4
        with:
          repository: ArnoldSmith86/virtualtabletop
          ref: feb2da69b8ed210146a29b41eed18bb87d925e77
          path: virtualtabletop

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sanguosha-manual-vtt/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: sanguosha-manual-vtt
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        working-directory: sanguosha-manual-vtt
        run: pnpm check

      - name: Upload checked source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checked-source
          path: |
            sanguosha-manual-vtt/tests
            sanguosha-manual-vtt/.gitignore
          retention-days: 1
