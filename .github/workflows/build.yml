name: Build package

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build .vtt
        run: pnpm build

      - name: Upload game package
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Sanguosha-Manual-4-12P
          path: dist/Sanguosha-Manual-4-12P.vtt
          if-no-files-found: error
          retention-days: 3

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Sanguosha-Manual-4-12P.vtt
          generate_release_notes: true

      - name: Update VTT library shelf
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.VTT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "VTT_DISPATCH_TOKEN is not set; skip shelf dispatch"
            exit 0
          fi
          gh workflow run import-sanguosha-library.yml \
            --repo Cc-Cece/virtualtabletop \
            -f tag="${GITHUB_REF_NAME}"
